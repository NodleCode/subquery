specVersion: 1.0.0
name: subql-nodle
version: 1.0.0
runner:
  node:
    name: "@subql/node"
    version: "*"
    options:
      historical: false
      unsafe: true
  query:
    name: "@subql/query"
    version: "*"
description: "Subquery indexer for Nodle network."
repository: https://github.com/NodleCode/subquery.git
schema:
  file: ./schema.graphql
network:
  chainId: "0xd9d12d9139d020f658d4469fa5c02e331195227da62567d7bf9bbd1abaf77522"
  endpoint: "https://node-6957502816543653888.lh.onfinality.io/jsonrpc?apikey=09b04494-3139-4b57-a5d1-e1c4c18748ce"
chaintypes:
  file: ./dist/chaintypes.js
dataSources:
  - kind: substrate/Runtime
    startBlock: 1
    mapping:
      file: ./dist/index.js
      handlers:
        - handler: handleUniquesTransferEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Transferred
        - handler: handleUniquesBurnedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Burned
        - handler: handleUniquesDestroyedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Destroyed
        - handler: handleUniquesIssuedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Issued
        - handler: handleUniquesCreatedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Created
        - handler: handleUniquesMetadataSetEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: MetadataSet
        - handler: handleUniquesCollectionMetadataSetEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: CollectionMetadataSet
        - handler: handleUniquesOwnershipAcceptanceChangedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: OwnershipAcceptanceChanged
        - handler: handleUniquesTeamChangedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: TeamChanged
        - handler: handleBalancesTransferEvent
          kind: substrate/EventHandler
          filter:
            module: balances
            method: Transfer
        - handler: handleSponsorshipCreatePotCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: createPot
        - handler: handleSponsorshipRegisterUsersCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: registerUsers
        - handler: handleSponsorshipRemoveUsersCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: removeUsers
        - handler: handleSponsorshipUpdatePotLimitsCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: updatePotLimits
        - handler: handleSponsorshipUpdateSponsorshipTypeCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: updateSponsorshipType
        - handler: handleSponsorshipUpdateUsersLimitsCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: updateUsersLimits
        - handler: handleSponsorshipRemovePotCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: removePot
        - handler: handleSponsorshipSponsorForCall
          kind: substrate/CallHandler
          filter:
            module: sponsorship
            method: sponsorFor
