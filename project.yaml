specVersion: 1.0.0
name: subql-nodle
version: 1.0.0
runner:
  node:
    name: "@subql/node"
    version: "*"
    options:
      historical: false
      skipTransactions: false
  query:
    name: "@subql/query"
    version: "*"
description: "Subquery indexer for Nodle network"
repository: https://github.com/NodleCode/subquery.git
schema:
  file: ./schema.graphql
network:
  chainId: "0x97da7ede98d7bad4e36b4d734b6055425a3be036da2a332ea5a7037656427a21"
  endpoint: "wss://nodle-parachain.api.onfinality.io/ws?apikey=3d5079b5-564a-4973-af46-336e3f9b63ef"
chaintypes:
  file: ./dist/chaintypes.js
dataSources:
  - kind: substrate/Runtime
    startBlock: 767238
    mapping:
      file: ./dist/index.js
      handlers:
        - handler: handleUniquesTransferEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Transferred
        - handler: handleUniquesBurnedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Burned
        - handler: handleUniquesDestroyedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Destroyed
        - handler: handleUniquesIssuedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Issued
        - handler: handleUniquesCreatedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: Created
        - handler: handleUniquesMetadataSetEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: MetadataSet
        - handler: handleUniquesCollectionMetadataSetEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: CollectionMetadataSet
        - handler: handleUniquesOwnershipAcceptanceChangedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: OwnershipAcceptanceChanged
        - handler: handleUniquesTeamChangedEvent
          kind: substrate/EventHandler
          filter:
            module: uniques
            method: TeamChanged
