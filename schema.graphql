type Collection @entity {
    id: ID!
    collectionId: Float! @index
    issuer: String! @index
    admin: String! @index
    owner: String! @index
    freezer: String
    metadataCid: String
    isDestroyed: Boolean!
    createdAt: BigInt @index
    updatedAt: BigInt @index
    items: [Item] @derivedFrom(field: "collection")
}

type Item @entity @compositeIndexes(fields: [["owner", "itemId"]]) {
    id: ID!
    itemId: Float! @index
    collectionItemKey: String! @index
    collection: Collection!
    metadataCid: String
    isBurned: Boolean!
    createdAt: BigInt @index
    updatedAt: BigInt @index
    owner: String
}

type UniquesTransfer @entity @compositeIndexes(fields: [["from", "to"]]) {
    id: ID!
    txHash: String @index
    block: BigInt @index
    from: String @index
    to: String @index
    collection: Collection!
    item: Item!
    fee: BigInt
    timestamp: BigInt @index
    success: Boolean
}